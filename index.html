<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="description"
    content="ระบบเช็ควิชาที่เรียนแล้วและติดตามความคืบหน้าการเรียน"
  />

  <title>Course Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=block"
    rel="stylesheet"
  />

  <script>
    (() => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const root = document.documentElement;
      root.classList.add('anim');
      let started = false;
      let cleaned = false;
      let bootTimer;
      let safetyTimer;

      const clean = () => {
        if (cleaned) return;
        cleaned = true;
        window.clearTimeout(bootTimer);
        window.clearTimeout(safetyTimer);
        document.removeEventListener('animationend', onEnd, true);
        root.classList.remove('anim', 'go');
      };

      const onEnd = (event) => {
        if (event.animationName === 'appEnter') clean();
      };

      const start = () => {
        if (started || cleaned) return;
        started = true;
        window.clearTimeout(bootTimer);
        document.addEventListener('animationend', onEnd, true);
        safetyTimer = window.setTimeout(clean, 2600);
        root.classList.add('go');
      };

      const boot = () => {
        bootTimer = window.setTimeout(start, 900);
        if (document.fonts?.ready) {
          document.fonts.ready.then(start, start);
        } else {
          start();
        }
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>

  <script type="module" src="/src/main.js"></script>
</head>

<body>

  <div class="bg" role="img" aria-label="พื้นหลังโลกดิจิทัลโทนม่วงสำหรับ BU Course Tracker">
    <div class="bg-globe" aria-hidden="true">
      <div class="bg-globe-surface"></div>
      <span class="bg-globe-orbit"></span>
      <span class="bg-globe-orbit bg-globe-orbit-secondary"></span>
    </div>
    <video class="bg-video is-active" id="bgVideoA" autoplay muted loop playsinline
      preload="auto" disablepictureinpicture aria-hidden="true"
      poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4" />
    </video>
    <video class="bg-video" id="bgVideoB" muted loop playsinline
      preload="auto" disablepictureinpicture aria-hidden="true"
      poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4" />
    </video>
  </div>

  <div id="app">
    <div class="app-loading">
      <div class="loading-spinner"></div>
      <p>กำลังโหลดระบบ...</p>
    </div>
  </div>

  <script>
    (() => {
      const videoA = document.getElementById('bgVideoA');
      const videoB = document.getElementById('bgVideoB');
      if (!videoA || !videoB) return;

      const background = videoA.closest('.bg');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        videoA.removeAttribute('autoplay');
        videoA.pause();
        videoB.pause();
        try {
          videoA.currentTime = 0;
        } catch {
          // Metadata might not be available before the poster is shown.
        }
        background?.classList.add('has-video');
        return;
      }

      const fadeDuration = 0.9;
      let current = videoA;
      let next = videoB;
      let swapping = false;
      let cleanupTimer;

      [videoA, videoB].forEach((video) => {
        video.addEventListener('playing', () => {
          background?.classList.add('has-video');
        });
        video.addEventListener('error', () => {
          if (videoA.paused && videoB.paused) {
            background?.classList.remove('has-video');
          }
        });
      });

      const play = (video) => {
        const playback = video.play();
        if (playback?.catch) playback.catch(() => {});
      };

      const tick = () => {
        if (swapping || !current.duration) return;
        if (current.duration - current.currentTime > fadeDuration) return;

        swapping = true;
        const outgoing = current;
        next.currentTime = 0;
        play(next);
        next.classList.add('is-active');
        outgoing.classList.remove('is-active');
        current = next;
        next = outgoing;
        cleanupTimer = window.setTimeout(() => {
          outgoing.pause();
          outgoing.currentTime = 0;
          swapping = false;
        }, fadeDuration * 1000 + 100);
      };

      videoA.addEventListener('timeupdate', tick);
      videoB.addEventListener('timeupdate', tick);
      window.addEventListener('pagehide', () => window.clearTimeout(cleanupTimer), { once: true });
      play(videoA);
    })();
  </script>

</body>
</html>
